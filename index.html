<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Weather and world clock for Boca Raton, Fargo, and Guadalupe, powered by Open-Meteo.">
  <meta name="theme-color" content="#6d84a2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Weather</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">
  <!-- Shared gradients and filters for the weather icons and CRT screens -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="gSun" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fff9c4"/>
        <stop offset=".45" stop-color="#ffd52e"/>
        <stop offset="1" stop-color="#f59a00"/>
      </radialGradient>
      <radialGradient id="gMoon" cx="35%" cy="30%" r="80%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#c9cfdb"/>
      </radialGradient>
      <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#c7d3e0"/>
      </linearGradient>
      <linearGradient id="gCloudDark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9aa6b4"/>
        <stop offset="1" stop-color="#5d6773"/>
      </linearGradient>
      <linearGradient id="gDrop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9fd8ff"/>
        <stop offset="1" stop-color="#1f7fd6"/>
      </linearGradient>
      <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff27a"/>
        <stop offset="1" stop-color="#f5a300"/>
      </linearGradient>
      <!-- CRT look: barrel warp (map and size set in app.js) + phosphor glow -->
      <filter id="crtWarp" filterUnits="userSpaceOnUse" x="0" y="0" width="300" height="100" color-interpolation-filters="sRGB">
        <feImage id="crtMap" x="0" y="0" width="300" height="100" preserveAspectRatio="none" result="map"/>
        <feDisplacementMap in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G" result="warped"/>
        <feGaussianBlur in="warped" stdDeviation="1.8" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="warped"/></feMerge>
      </filter>
    </defs>
  </svg>

  <div class="window">
    <header class="titlebar">
      <h1 class="title">Weather</h1>
      <div class="toolbar">
        <div class="segmented" role="group" aria-label="Temperature unit">
          <button type="button" data-unit="C" class="active">&deg;C</button>
          <button type="button" data-unit="F">&deg;F</button>
          <button type="button" data-unit="K">K</button>
        </div>
        <div class="account" id="account" hidden>
          <img class="account-avatar" id="account-avatar" alt="" referrerpolicy="no-referrer" hidden>
          <span class="account-initial" id="account-initial" aria-hidden="true" hidden></span>
          <span class="account-name" id="account-name"></span>
          <button type="button" class="bar-button text" id="account-signout">Sign Out</button>
        </div>
        <button type="button" class="bar-button" id="refresh" aria-label="Refresh weather">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2.2a5.8 5.8 0 1 1-1.7-4.1L13 11h7V4z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <main class="cards" id="cards" aria-live="polite"></main>

    <footer class="statusbar">
      <span id="updated">Loading&hellip;</span>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>
    </footer>
  </div>

  <!-- Login (Supabase Auth) -->
  <div class="auth" id="auth" hidden>
    <form class="auth-sheet" id="auth-form" novalidate>
      <h2 id="auth-heading">Sign In</h2>
      <p class="auth-sub" id="auth-sub">Sign in to see the weather.</p>
      <button type="button" class="auth-google" id="auth-google">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
      <p class="auth-divider" id="auth-divider"><span>or</span></p>
      <div id="auth-fields">
        <div id="auth-username-row" hidden>
          <label for="auth-username">Username</label>
          <input id="auth-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24">
        </div>
        <label for="auth-email">Email</label>
        <input id="auth-email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        <label for="auth-password">Password</label>
        <input id="auth-password" name="password" type="password" autocomplete="current-password" required>
        <div id="auth-confirm-row" hidden>
          <label for="auth-confirm">Confirm Password</label>
          <input id="auth-confirm" name="confirm" type="password" autocomplete="new-password">
        </div>
      </div>
      <p class="auth-error" id="auth-error" role="alert"></p>
      <p class="auth-notice" id="auth-notice" role="status" hidden></p>
      <button type="submit" class="auth-submit" id="auth-submit">Sign In</button>
      <p class="auth-resend" id="auth-resend-row" hidden><button type="button" id="auth-resend">Resend confirmation email</button></p>
      <p class="auth-switch"><span id="auth-switch-text">New here?</span> <button type="button" id="auth-switch">Create an account</button></p>
    </form>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
