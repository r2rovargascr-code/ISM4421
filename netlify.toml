# Netlify configuration — static site, no build step required.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.open-meteo.com https://khwpqueqpllwukqsyrex.supabase.co; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/*.{css,js,svg}"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
