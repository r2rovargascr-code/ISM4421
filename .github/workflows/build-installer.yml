name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [claude/nifty-hypatia-bohpvl, main]
    paths: ["spotdl_lava/**", "packaging/**", "requirements.txt", ".github/workflows/build-installer.yml"]
    tags: ["v*"]

permissions:
  contents: write  # to attach the installer to a release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Build PyInstaller's bootloader from source instead of using the prebuilt one that many
          # antivirus programs flag as a false positive.
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --no-binary pyinstaller pyinstaller

      - name: Download QuickJS (JavaScript runtime yt-dlp needs for YouTube)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (gh release view --repo quickjs-ng/quickjs --json tagName,assets | ConvertFrom-Json)
          "QuickJS-ng release $($assets.tagName): $($assets.assets.name -join ', ')"
          $asset = $assets.assets | Where-Object { $_.name -match '^qjs-windows-(x86_64|x64|amd64)\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "no Windows x64 qjs build in the latest QuickJS-ng release" }
          New-Item -ItemType Directory -Force vendor | Out-Null
          gh release download --repo quickjs-ng/quickjs $assets.tagName --pattern $asset.name --output vendor\qjs.exe
          (& vendor\qjs.exe --help 2>&1 | Select-Object -First 1)

      - name: Live check - YouTube Music playlist to MP3 (from source)
        continue-on-error: true  # YouTube sometimes blocks data-centre IPs; the result is still reported
        run: python packaging/ci_youtube_check.py vendor\qjs.exe

      - name: Live check - Spotify links (from source)
        continue-on-error: true
        run: python packaging/ci_spotify_check.py

      - name: Build app
        shell: pwsh
        run: |
          python packaging/build.py
          Copy-Item vendor\qjs.exe "dist\spotDL Lava\qjs.exe"

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\spotDL Lava\spotDL Lava.exe" -ArgumentList "--browser","--demo","--port","8790" -PassThru
          Start-Sleep -Seconds 10
          $state = Invoke-RestMethod -Uri "http://127.0.0.1:8790/api/state"
          Stop-Process -Id $p.Id -Force
          if ($null -eq $state.items) { throw "app did not respond" }
          "packaged app started and answered"

      - name: Smoke test the app window
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "spotDL Lava\spotdl-lava.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          # .NET errors from the window engine go to the native stderr, so capture it
          $p = Start-Process -FilePath "dist\spotDL Lava\spotDL Lava.exe" -ArgumentList "--demo" -PassThru `
                 -RedirectStandardOutput win-out.txt -RedirectStandardError win-err.txt
          Start-Sleep -Seconds 25
          $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          "process running: $([bool]$proc)  exit code: $($p.ExitCode)  window title: '$($proc.MainWindowTitle)'"
          "----- log -----"
          if (Test-Path $log) { Get-Content $log -Tail 120 } else { "no log file" }
          "----- stderr -----"
          Get-Content win-err.txt -ErrorAction SilentlyContinue
          "----- stdout -----"
          Get-Content win-out.txt -ErrorAction SilentlyContinue
          "---------------"
          if ($proc) { Stop-Process -Id $p.Id -Force }
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if (-not $proc) { throw "app exited instead of showing its window" }
          if ($text -notmatch "window loaded the interface") { throw "app window did not load the interface" }
          if ($text -notmatch "JavaScript runtime for YouTube: .*qjs") { throw "bundled QuickJS was not found by the app" }

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: spotDL-Lava-Setup
          path: dist/spotDL-Lava-Setup.exe

      - name: Save installer in the branch for direct download
        if: github.ref_type == 'branch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force installer | Out-Null
          Copy-Item dist\spotDL-Lava-Setup.exe installer\
          git add installer/spotDL-Lava-Setup.exe
          git commit -m "Update Windows installer [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spotDL-Lava-Setup.exe
